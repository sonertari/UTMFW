#----------------------------------------------------------------------------#
# suricata
#----------------------------------------------------------------------------#
<Plugin tail>
	<File "/var/log/suricata/fast.log">
		Instance "suricata"
		<Match>
			Regex " suricata\\[.* -> "
			DSType "DeriveInc"
			Type "derive"
			Instance "alert"
		</Match>
	</File>
	<File "/var/log/suricata/suricata.log">
		Instance "suricata"
		<Match>
			Regex ": WARNING: "
			DSType "DeriveInc"
			Type "derive"
			Instance "warning"
		</Match>
		<Match>
			Regex ": ERROR: "
			DSType "DeriveInc"
			Type "derive"
			Instance "error"
		</Match>
		<Match>
			Regex ": (CRITICAL|ALERT|EMERGENCY): "
			DSType "DeriveInc"
			Type "derive"
			Instance "critical"
		</Match>
	</File>
</Plugin>

<Plugin logparser>
	<Logfile "/var/log/suricata/suricata.log">
		FirstFullRead false
		<Message "suricata">
			DefaultType "suricata"
			<Match "match">
				Regex "^... .. ..:..:.. .*: (WARNING|ERROR|CRITICAL|ALERT|EMERGENCY):"
				SubmatchIdx -1
			</Match>
			<Match "log">
				PluginInstance "WARNING"
				Regex ".*: WARNING: .*"
				IsMandatory false
			</Match>
			<Match "log">
				PluginInstance "ERROR"
				Regex ".*: ERROR: .*"
				IsMandatory false
			</Match>
			<Match "log">
				PluginInstance "CRITICAL"
				Regex ".*: (CRITICAL|ALERT|EMERGENCY): .*"
				IsMandatory false
			</Match>
			<Match "date">
				Regex ": (WARNING|ERROR|CRITICAL|ALERT|EMERGENCY):.*$"
				SubmatchIdx -1
			</Match>
		</Message>
	</Logfile>
</Plugin>

<Plugin notify_fifo>
	<Fifo "suricata_critical.fifo">
		Plugin "logparser"
		PluginInstance "CRITICAL"
		Type "suricata"
	</Fifo>
	<Fifo "suricata_error.fifo">
		Plugin "logparser"
		PluginInstance "ERROR"
		Type "suricata"
	</Fifo>
	<Fifo "suricata_warning.fifo">
		Plugin "logparser"
		PluginInstance "WARNING"
		Type "suricata"
	</Fifo>
</Plugin>
